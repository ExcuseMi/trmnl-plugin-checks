# Reusable: a plugin repo calls this to run the base checks on itself (see examples/call-plugin-check.yml).
name: plugin-check
on:
  workflow_call:
    inputs:
      plugin-dir:
        description: Plugin repo folder to check, relative to the repo root
        type: string
        default: .
      checks-ref:
        description: Ref of trmnl-plugin-checks to use
        type: string
        default: main
      skip-devices:
        description: Device names to leave out of the checks (commas or spaces); say why beside it in the calling workflow
        type: string
        default: ''
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          path: plugin-repo
      - uses: actions/checkout@v4
        with:
          repository: ExcuseMi/trmnl-plugin-checks
          ref: ${{ inputs.checks-ref }}
          path: checks
          token: ${{ secrets.CHECKS_TOKEN || github.token }}
      - run: ruby checks/test/retry_test.rb
      - run: docker pull trmnl/trmnlp:latest
      - run: TPC_NAME="${{ github.event.repository.name }}" TPC_SKIP_DEVICES="${{ inputs.skip-devices }}" checks/bin/check "plugin-repo/${{ inputs.plugin-dir }}"
